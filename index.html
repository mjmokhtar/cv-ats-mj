<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MJ's Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var saved = localStorage.getItem('theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var mode = saved || (prefersDark ? 'dark' : 'light')
        var dark = mode === 'dark'
        var el = document.documentElement
        var vars = dark
          ? {
              '--notion-bg': '#191919',
              '--notion-card': '#252525',
              '--notion-card-hover': '#2a2a2a',
              '--notion-border': '#373737',
              '--notion-muted': '#9b9b9b',
              '--notion-text': '#ebebeb',
            }
          : {
              '--notion-bg': '#ffffff',
              '--notion-card': '#f7f7f5',
              '--notion-card-hover': '#efefef',
              '--notion-border': '#e3e3e0',
              '--notion-muted': '#787774',
              '--notion-text': '#37352f',
            }
        el.classList.add(dark ? 'dark' : 'light')
        el.style.colorScheme = mode
        for (var k in vars) el.style.setProperty(k, vars[k])
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
